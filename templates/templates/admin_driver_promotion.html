
{% extends "admin_base.html" %}
{% block title %}Promoção para Motoristas | Admin{% endblock %}
{% block admin_content %}
<div class="dash-head">
  <div>
    <div class="eyebrow">SITE</div>
    <h1>Promoção para motoristas</h1>
    <p>Altere o valor do dia e os pacotes sem mexer no restante do site.</p>
  </div>
  <a class="btn ghost" href="{{ url_for('home') }}#motoristas" target="_blank">Ver promoção</a>
</div>

<section class="panel">
  <form method="post" class="form-grid two">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label class="full promo-safe-toggle">
      <span>Mostrar promoção no site</span>
      <input type="checkbox" name="active" {% if promo and promo.active %}checked{% endif %}>
    </label>

    <label>Valor do dia
      <div class="price-input-wrap">
        <span>R$</span>
        <input name="daily_price"
               value="{{ ('%.2f'|format(promo.daily_price|float)).replace('.', ',') if promo else '0,00' }}"
               inputmode="decimal">
      </div>
    </label>

    <label>Descrição do valor do dia
      <input name="daily_note" value="{{ promo.daily_note if promo else 'Valor especial do dia' }}">
    </label>

    <label>Pacote semanal — valor
      <div class="price-input-wrap">
        <span>R$</span>
        <input name="weekly_price"
               value="{{ ('%.2f'|format(promo.weekly_price|float)).replace('.', ',') if promo else '0,00' }}"
               inputmode="decimal">
      </div>
    </label>

    <label>Lavagens no semanal
      <input type="number" min="0" name="weekly_washes" value="{{ promo.weekly_washes if promo else 0 }}">
    </label>

    <label>Pacote mensal — valor
      <div class="price-input-wrap">
        <span>R$</span>
        <input name="monthly_price"
               value="{{ ('%.2f'|format(promo.monthly_price|float)).replace('.', ',') if promo else '0,00' }}"
               inputmode="decimal">
      </div>
    </label>

    <label>Lavagens no mensal
      <input type="number" min="0" name="monthly_washes" value="{{ promo.monthly_washes if promo else 0 }}">
    </label>

    <div class="form-section-title full">Textos</div>

    <label>Título
      <input name="title" value="{{ promo.title if promo else 'Promoção para motoristas' }}">
    </label>

    <label>Público
      <input name="audience" value="{{ promo.audience if promo else 'Motoristas de app, táxi e particular' }}">
    </label>

    <label class="full">Subtítulo
      <input name="subtitle" value="{{ promo.subtitle if promo else 'Condições especiais para quem roda todos os dias' }}">
    </label>

    <label class="full">WhatsApp
      <input name="whatsapp" value="{{ promo.whatsapp if promo else '+55 15 99665-4845' }}">
    </label>

    <button class="btn primary full" type="submit">Salvar promoção</button>
  </form>
</section>
{% endblock %}
