
{% extends "base.html" %}
{% block content %}
<section class="admin-shell">
  <aside class="sidebar">
    <div class="sidebar-title">ADMINISTRAÇÃO</div>
    <a href="{{ url_for('admin_dashboard') }}" class="{{ 'active' if request.endpoint=='admin_dashboard' else '' }}">Visão geral</a>
    <a href="{{ url_for('admin_cash') }}" class="{{ 'active' if request.endpoint in ['admin_cash','admin_close_cash'] else '' }}">Caixa diário</a>
    <a href="{{ url_for('admin_appointments') }}" class="{{ 'active' if request.endpoint in ['admin_appointments','admin_appointment_status'] else '' }}">Agendamentos</a>
    <a href="{{ url_for('admin_finance') }}" class="{{ 'active' if request.endpoint in ['admin_finance','admin_delete_transaction'] else '' }}">Financeiro</a>
    <a href="{{ url_for('admin_clients') }}" class="{{ 'active' if request.endpoint=='admin_clients' else '' }}">Clientes</a>
    <a href="{{ url_for('admin_employees') }}" class="{{ 'active' if request.endpoint in ['admin_employees','admin_toggle_employee'] else '' }}">Funcionários</a>
    <a href="{{ url_for('admin_services') }}" class="{{ 'active' if request.endpoint in ['admin_services','admin_toggle_service'] else '' }}">Serviços</a>
    <a href="{{ url_for('admin_reports') }}" class="{{ 'active' if request.endpoint in ['admin_reports','admin_reports_xlsx'] else '' }}">Relatórios</a>
    <a href="{{ url_for('home') }}">Ver site</a>
  </aside>
  <main class="admin-main">
    {% block admin_content %}{% endblock %}
  </main>
</section>
{% endblock %}
