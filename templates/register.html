
{% extends "base.html" %}
{% block title %}Criar conta | Boston Car Wash{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="eyebrow">ÁREA DO CLIENTE</div>
    <h1 class="auth-title">Criar conta</h1>
    <form method="post" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Nome<input name="name" required></label>
      <label>E-mail<input type="email" name="email" required></label>
      <label>Telefone<input name="phone"></label>
      <label>Senha<input type="password" name="password" minlength="6" required></label>
      <button class="btn primary" type="submit">Criar minha conta</button>
    </form>
  </div>
</section>
{% endblock %}
